[package]
name = "transonic-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Custom GStreamer elements: background audio mixing, silence trimming, channel demuxing and passthrough decoding"

[dependencies]
transonic-meta = { workspace = true }

gstreamer = { workspace = true }
gstreamer-audio = { workspace = true }
gstreamer-base = { workspace = true }
glib = { workspace = true }

[dev-dependencies]
gstreamer-app = { workspace = true }

[lib]
name = "transonic_plugins"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"
