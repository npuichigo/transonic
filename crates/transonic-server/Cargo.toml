[package]
name = "transonic-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Transonic media transform service: gRPC server binary"

[[bin]]
name = "transonic"
path = "src/main.rs"

[dependencies]
transonic-proto = { workspace = true }
transonic-core = { workspace = true }
transonic-plugins = { workspace = true }

gstreamer = { workspace = true }

tonic = { workspace = true }
prost = { workspace = true }

tokio = { workspace = true }
tokio-stream = "0.1"
async-trait = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }

clap = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
prometheus = { workspace = true }
axum = { workspace = true }

# jemalloc: a scalable multithreaded allocator.  On a high-core host glibc's
# per-thread malloc arenas retain a large resident set; jemalloc keeps a
# tighter footprint and (with background_threads) returns freed pages to the
# OS.  Set as the process global allocator in main.rs.  Not available on MSVC.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.6", features = ["background_threads"] }

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }
